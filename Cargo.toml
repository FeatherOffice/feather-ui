[package]
name = "feather-ui"
version = "0.2.9"
description = "Interface compartilhada da suíte FeatherOffice: tema, ícones, marca e componentes Iced"
authors = ["FeatherOffice"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"
repository = "https://github.com/FeatherOffice/feather-ui"
publish = false

[dependencies]
iced = { version = "0.13", features = ["svg", "canvas", "auto-detect-theme"] }

# Pressão da caneta (src/caneta.rs). Linux: XInput2 em Rust puro (x11rb,
# conexão própria, sem libxcb/libXi). Windows: WM_POINTER pela API do sistema.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

# Só o exemplo caneta_cliques (autoteste com clique sintético pelo XTest).
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dev-dependencies]
x11rb = { version = "0.13", features = ["xinput", "xtest"] }

# Só o exemplo caneta_wayland (mesa pelo protocolo tablet-v2, sem Iced/winit).
# wayland-client usa o backend Rust puro do wayland-backend (sem libwayland C).
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
libc = "0.2"
